<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynapForge Facebook Cover</title>
<style>
  :root { color-scheme: light; --bg: #eef0f3; --fg: #1c1c1e; --brand: #ff5500; --line: #d9dce1; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--brand); color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { color: #fff; filter: brightness(1.08); }
  label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  .stage { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
  .hint { color: #6b7280; font-size: 13px; margin: 10px 0 0; }
  .safe { position: absolute; left: calc(10px + (100% - 20px) * .15); right: calc(10px + (100% - 20px) * .15); top: calc(10px + (100% - 20px) * .0525); bottom: calc(10px + (100% - 20px) * .1575); border: 1px dashed rgba(255,255,255,.7); pointer-events: none; display: none; }
  .stage.on .safe { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SynapForge · Ảnh bìa Facebook 1640 × 856</h1>
  <div class="bar">
    <button id="again" class="primary">Đổi sóng khác</button>
    <label><input id="logo" type="checkbox" checked> Logo</label>
    <label><input id="text" type="checkbox" checked> Chữ</label>
    <label><input id="guide" type="checkbox"> Vùng an toàn</label>
    <button id="save">Tải PNG</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c" width="1640" height="856"></canvas>
    <div class="safe"></div>
  </div>
  <p class="hint">Bấm "Đổi sóng khác" đến khi vừa ý, tắt "Logo" và "Chữ" nếu muốn chỉ lấy nền, rồi "Tải PNG". Bật "Vùng an toàn": giữ chữ và logo trong khung nét đứt để không bị cắt trên điện thoại hoặc bị avatar che.</p>
</div>
<script>
const W = 1640, H = 856;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const logo = new Image();
let seed = Math.floor(Math.random() * 1e6);

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function background() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#050c1a'); g.addColorStop(1, '#0d1f3d');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, a] of [[0, H, 650, .30], [W, 0, 720, .42]]) {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(255,85,0,${a})`); rg.addColorStop(1, 'rgba(255,85,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
}

function waves(rnd) {
  const N = 18;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    const p1 = rnd() * 6.28, p2 = rnd() * 6.28;
    const f1 = 0.0035 + rnd() * 0.0025, f2 = 0.008 + rnd() * 0.005;
    const a1 = 35 + rnd() * 55, a2 = 10 + rnd() * 20;
    const off = (i - N / 2) * 15 + rnd() * 12;
    const th = 8 + rnd() * 64, alpha = 0.10 + rnd() * 0.26;
    const top = [], bot = [];
    for (let x = -20; x <= W + 20; x += 8) {
      const s = smooth(0.42, 1.02, x / W);                // sóng thấp ở trái/giữa, bốc lên góc phải
      const base = H * (0.88 - 0.78 * s);
      const y = base + off + a1 * Math.sin(x * f1 + p1) + a2 * Math.sin(x * f2 + p2);
      const t = th * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, Math.max(0, (x + 20) / (W + 40)))));
      top.push([x, y]); bot.push([x, y + t]);
    }
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(255,85,0,0)');
    g.addColorStop(0.25, `rgba(255,85,0,${alpha})`);
    g.addColorStop(0.7, `rgba(255,140,30,${alpha})`);
    g.addColorStop(1, `rgba(255,205,100,${alpha * 0.9})`);
    ctx.beginPath();
    top.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    for (let k = bot.length - 1; k >= 0; k--) ctx.lineTo(bot[k][0], bot[k][1]);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    const hg = ctx.createLinearGradient(0, 0, W, 0);
    hg.addColorStop(0, 'rgba(255,160,70,0)'); hg.addColorStop(0.5, `rgba(255,170,80,${0.30 + rnd() * 0.3})`); hg.addColorStop(1, 'rgba(255,230,160,0.7)');
    ctx.beginPath();
    top.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.lineWidth = 1.1 + rnd() * 1.2; ctx.strokeStyle = hg; ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function calm() {  // làm tối phần giữa để chữ dễ đọc
  const rg = ctx.createRadialGradient(W / 2, H * 0.40, 0, W / 2, H * 0.40, W * 0.42);
  rg.addColorStop(0, 'rgba(5,12,26,.60)'); rg.addColorStop(1, 'rgba(5,12,26,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
}

function content() {
  const showLogo = document.getElementById('logo').checked, showText = document.getElementById('text').checked;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  let y = H * 0.30;
  if (showLogo && logo.complete && logo.naturalWidth) {
    const w = 540, h = w * logo.naturalHeight / logo.naturalWidth;
    ctx.drawImage(logo, (W - w) / 2, y - h / 2, w, h);
    y += h / 2 + 46;
  } else { y += 20; }
  if (showText) {
    ctx.fillStyle = '#fff'; ctx.font = '700 36px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Forging Intelligence. Engineering Scale.', W / 2, y);
    ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.font = '500 24px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Web bán hàng  ·  Marketplace  ·  Thanh toán tự động  ·  AI', W / 2, y + 46);
    ctx.fillStyle = '#ff7a33'; ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Đà Nẵng  ·  contact@synapforge.dev', W / 2, y + 88);
  }
}

function draw() {
  background(); waves(rng(seed)); calm(); content();
}

logo.onload = draw;
